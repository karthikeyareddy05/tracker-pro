name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash enables -o pipefail, so `cmd | tee log` fails when cmd fails.
    shell: bash

env:
  FORCE_COLOR: "0"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  server:
    name: Server — typecheck, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install, typecheck, test, build
        run: |
          mkdir -p ci-out
          ( cd server && npm install && npm run typecheck && npm test && npm run build ) 2>&1 | tee ci-out/server.log
      - name: Publish log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/push-ci-output.sh server ci-out

  app:
    name: App — typecheck, tests, Android APK
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check preinstalled Android SDK
        run: |
          mkdir -p ci-out
          echo "ANDROID_HOME=$ANDROID_HOME" | tee ci-out/android-sdk.txt
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1 | tee -a ci-out/android-sdk.txt
          java -version 2>&1 | tee -a ci-out/android-sdk.txt
      - name: Install, typecheck, unit tests
        run: |
          mkdir -p ci-out
          ( cd app && npm install && npm run typecheck && npm test ) 2>&1 | tee ci-out/app-test.log
      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          bash scripts/build-android.sh 2>&1 | tee ci-out/android-build.log
          ls -la dist-android | tee -a ci-out/android-build.log
          cp app/android/app/src/main/AndroidManifest.xml ci-out/ 2>/dev/null || true
          cp app/android/app/build.gradle ci-out/app-build.gradle 2>/dev/null || true
          ( cd app && npm ls --depth=0 ) > ci-out/app-packages.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-pro-apk
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as a GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-latest"
          if [ -n "$VITE_API_BASE_URL" ]; then SERVER_NOTE="Server: $VITE_API_BASE_URL"; else SERVER_NOTE="Server address NOT configured in this build — sign-in won't work until the API_BASE_URL repository variable is set and the app is rebuilt."; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist-android/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Tracker Pro ${VERSION_NAME} (Android)" \
            --notes "Built from ${GITHUB_SHA} by CI run ${GITHUB_RUN_NUMBER}. ${SERVER_NOTE} Install the *-debug.apk on your phone (allow installs from this source when prompted)."
      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/push-ci-output.sh app ci-out

  e2e:
    name: End-to-end — real API + web app in a phone-sized browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and build
        run: |
          mkdir -p ci-out
          ( cd server && npm install ) 2>&1 | tail -n 20 | tee ci-out/e2e-install.log
          ( cd app && npm install && npm run build ) 2>&1 | tail -n 40 | tee -a ci-out/e2e-install.log
          ( cd e2e && npm install && npx playwright install --with-deps chromium ) 2>&1 | tail -n 20 | tee -a ci-out/e2e-install.log
      - name: Run journey
        run: ( cd e2e && npx playwright test ) 2>&1 | tee ci-out/e2e.log
      - name: Publish screenshots and logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -r e2e/screens ci-out/ 2>/dev/null || true
          cp -r e2e/test-results ci-out/ 2>/dev/null || true
          bash scripts/push-ci-output.sh e2e ci-out

  android-smoke:
    name: Android emulator — install & launch
    needs: app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tracker-pro-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-smoke.sh "$(ls apk/*-debug.apk | head -n1)" smoke-out
      - name: Publish screenshots and logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoke-out
          bash scripts/push-ci-output.sh android-smoke smoke-out
